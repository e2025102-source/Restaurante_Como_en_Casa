plugins {
    id 'com.android.application'
}

android {
    namespace 'pe.edu.paijan.comoencasa'
    compileSdk 36

    defaultConfig {
        applicationId "pe.edu.paijan.comoencasa"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
